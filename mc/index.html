<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft 26.3 JM</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1020;color:#f8fafc;font:16px system-ui,sans-serif}
body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
main{max-width:640px;padding:28px;border:1px solid #334155;border-radius:16px;background:#111827}
p{color:#cbd5e1;line-height:1.5}button{border:0;border-radius:8px;padding:12px 16px;background:#2563eb;color:white;font-weight:700;cursor:pointer}
#status{white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>Minecraft 26.3 JM</h1>
<p id="status">Loading split client manifest from jsDelivr…</p>
<button id="start" hidden>Start game</button>
<p><small>The client is divided into smaller JavaScript files for delivery through jsDelivr.</small></p>
</main>
<script>
(async()=>{
 const status=document.getElementById('status');
 const start=document.getElementById('start');
 const base='https://cdn.jsdelivr.net/gh/atharvchoudhari123/Sites@main/mc/';
 const yieldToBrowser=()=>('scheduler' in window && typeof scheduler.yield==='function')
   ? scheduler.yield()
   : new Promise(resolve=>setTimeout(resolve,0));
 try{
   const response=await fetch(base+'manifest.json');
   if(!response.ok) throw new Error('Manifest request failed: '+response.status);
   const manifest=await response.json();
   status.textContent='Ready to load '+manifest.files.length+' client parts ('+(manifest.sourceBytes/1048576).toFixed(1)+' MiB).';
   start.hidden=false;
   start.onclick=async()=>{
     start.disabled=true;
     try{
       window.__MC_PARTS=[];
       const parts=window.__MC_PARTS;
       for(let i=0;i<manifest.files.length;i++){
         status.textContent='Loading client part '+(i+1)+' of '+manifest.files.length+'…';
         await yieldToBrowser();
         await new Promise((resolve,reject)=>{
           const script=document.createElement('script');
           script.src=base+'parts/'+manifest.files[i];
           script.onload=resolve;
           script.onerror=()=>reject(new Error('Failed to load '+manifest.files[i]));
           document.head.appendChild(script);
         });
       }
       status.textContent='Preparing game data…';
       const total=parts.reduce((n,p)=>n+p.length,0);
       const binary=new Uint8Array(total);
       let offset=0;
       for(let i=0;i<parts.length;i++){
         status.textContent='Decoding part '+(i+1)+' of '+parts.length+'…';
         const raw=atob(parts[i]);
         // Copy in small batches so the preview/browser can process UI updates.
         for(let startAt=0;startAt<raw.length;startAt+=65536){
           const endAt=Math.min(startAt+65536,raw.length);
           for(let j=startAt;j<endAt;j++) binary[offset++]=raw.charCodeAt(j);
           await yieldToBrowser();
         }
       }
       status.textContent='Opening game…';
       await yieldToBrowser();
       const html=new TextDecoder().decode(binary);
       document.open();
       document.write(html);
       document.close();
     }catch(error){
       status.textContent='Could not start the client: '+error.message;
       start.disabled=false;
     }
   };
 }catch(error){
   status.textContent='Could not load the client: '+error.message+'\nRun the “Split Minecraft 26.3 HTML for jsDelivr” workflow in your repository Actions tab, then wait for it to finish.';
 }
})();
</script>
</body>
</html>
