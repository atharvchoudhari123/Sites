<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%"
     height="100%"
     viewBox="0 0 1920 1080">

  <foreignObject x="0" y="0" width="1920" height="1080">
    <xhtml:iframe
      srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1.0,user-scalable=no&quot;&gt;
&lt;title&gt;Achievement Unlocked&lt;/title&gt;

&lt;style&gt;
html,body {
  margin:0;
  padding:0;
  background:black;
  overflow:hidden;
  width:100%;
  height:100%;
}

#game {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:black;
  overflow:hidden;
}
&lt;/style&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js&quot;&gt;&lt;/script&gt;

&lt;/head&gt;

&lt;body&gt;

&lt;div id=&quot;game&quot;&gt;&lt;/div&gt;

&lt;script&gt;
const game = document.getElementById('game');

function resizeGame() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  const aspect = 5.5 / 3;

  let width = w;
  let height = width / aspect;

  if (height &gt; h) {
    height = h;
    width = height * aspect;
  }

  game.style.width = width + 'px';
  game.style.height = height + 'px';
}

window.addEventListener('resize', resizeGame);

window.addEventListener('DOMContentLoaded', () =&gt; {
  resizeGame();

  const ruffle = window.RufflePlayer?.newest();

  if (!ruffle) {
    game.textContent = 'Ruffle failed to load.';
    return;
  }

  const player = ruffle.createPlayer();

  player.style.width = '100%';
  player.style.height = '100%';
  player.style.background = 'black';

  game.appendChild(player);

  player.load('https://cdn.jsdelivr.net/gh/asianmemeboi/AAA-Fun-World@2f45ea1aca0db7f1963e694bc2034d9ea885585b/achievement-unlocked.swf');
});
&lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;"
      style="width:100%;height:100%;border:0;background:black;"
      allow="fullscreen"
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock">
    </xhtml:iframe>
  </foreignObject>

</svg>
