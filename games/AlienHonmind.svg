<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%"
     height="100%"
     viewBox="0 0 1920 1080">

  <foreignObject x="0" y="0" width="1920" height="1080">

    <xhtml:iframe
      srcdoc="&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;body style=&quot;margin:0;background:black;color:white;font-family:Arial;text-align:center;&quot;&gt;
&lt;h1&gt;SVG SRCdoc works!&lt;/h1&gt;
&lt;p&gt;This is running inside the SVG.&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;"
      style="width:100%;height:100%;border:0;">
    </xhtml:iframe>

  </foreignObject>

</svg>
